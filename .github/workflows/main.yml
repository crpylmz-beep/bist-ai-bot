name: BIST AI Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 6-18 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: BIST verisini oluştur
        run: |
          python -c "import bist_bot; s,t=bist_bot.bist_tara(); bist_bot.web_verisi_kaydet(s); print('WEB VERISI GUNCELLENDI')"

      - name: Veriyi GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webapp/data/bist_data.json
          git diff --cached --quiet || git commit -m "BIST verisini otomatik güncelle"
          git push
