name: BIST AI Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 6-18 * * 1-5"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: BIST verisini oluştur
        run: |
          python -c "import bist_bot; s,t=bist_bot.bist_tara(); bist_bot.web_verisi_kaydet(s); print('WEB VERISI GUNCELLENDI')"

      # Runtime data must never create a main commit/application redeployment.
      - name: Veriyi ayrı çalışma çıktısı olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: bist-runtime-data
          path: webapp/data/bist_data.json
          retention-days: 3
          if-no-files-found: error
